# Real client address: defines $evergarden_client_ip for the mode chosen by
# EVERGARDEN_GATEWAY_REAL_IP (direct, proxy or cloudflare; see
# deploy/nginx/real-ip/). deploy/nginx/real-ip/entrypoint.sh renders this file
# at start.
include /tmp/evergarden-gateway/real-ip.conf;

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream evergarden_mcp {
    zone evergarden_mcp 64k;
    server mcp:8000 resolve;
}

upstream evergarden_approval_ui {
    zone evergarden_approval_ui 64k;
    server approval-ui:8010 resolve;
}

upstream evergarden_mail_ui {
    zone evergarden_mail_ui 64k;
    server mail-ui:8020 resolve;
}

server {
    listen 8080 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    # Replace, never append: the upstream sees exactly one address, the client
    # resolved by the real-IP mode, and the mail UI keys its login throttle on
    # it. A client-supplied chain never reaches the apps. In direct mode behind
    # a reverse proxy this is the proxy's address and all remote clients share
    # one bucket; choose proxy or cloudflare mode there.
    proxy_set_header X-Forwarded-For $evergarden_client_ip;
    # Browser identity is owned by Evergarden's signed administrator session.
    # Never forward caller-supplied identity or legacy proxy-secret headers.
    proxy_set_header Remote-User "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Email "";
    proxy_set_header Remote-Name "";
    proxy_set_header X-Evergarden-Proxy-Secret "";

    location = /gateway-healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"evergarden-gateway"}\n';
    }

    # MCP performs its own OAuth bearer authentication. Human proxy identity
    # headers are deliberately stripped on this programmatic surface.
    location = /.well-known/oauth-protected-resource {
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header X-Evergarden-Proxy-Secret "";
        proxy_pass http://evergarden_mcp;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header X-Evergarden-Proxy-Secret "";
        proxy_pass http://evergarden_mcp;
    }

    location ^~ /mcp {
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Email "";
        proxy_set_header Remote-Name "";
        proxy_set_header X-Evergarden-Proxy-Secret "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://evergarden_mcp;
    }

    # Approval and provider-OAuth routes share the public origin and validate
    # the same signed administrator cookie plus their own CSRF checks.
    location = /approvals {
        error_page 502 503 504 = @evergarden_api_unavailable;
        error_page 413 = @evergarden_api_too_large;
        proxy_pass http://evergarden_approval_ui;
    }
    location = /approvals/batch {
        error_page 502 503 504 = @evergarden_api_unavailable;
        error_page 413 = @evergarden_api_too_large;
        proxy_pass http://evergarden_approval_ui;
    }
    # Revocation is the only way to cancel a durable human approval.
    location = /approvals/revoke {
        error_page 502 503 504 = @evergarden_api_unavailable;
        error_page 413 = @evergarden_api_too_large;
        proxy_pass http://evergarden_approval_ui;
    }
    location = /drafts { error_page 502 503 504 = @evergarden_api_unavailable; proxy_pass http://evergarden_approval_ui; }
    location ^~ /drafts/ { error_page 502 503 504 = @evergarden_api_unavailable; proxy_pass http://evergarden_approval_ui; }
    location = /session { error_page 502 503 504 = @evergarden_api_unavailable; proxy_pass http://evergarden_approval_ui; }
    location = /review { proxy_pass http://evergarden_approval_ui; }
    location = /review/send { proxy_pass http://evergarden_approval_ui; }
    location = /oauth { proxy_pass http://evergarden_approval_ui; }
    location ^~ /oauth/ { error_page 502 503 504 = @evergarden_api_unavailable; proxy_pass http://evergarden_approval_ui; }
    location = /assets/approval.css { proxy_pass http://evergarden_approval_ui; }
    location = /assets/review.js { proxy_pass http://evergarden_approval_ui; }
    location = /assets/send.js { proxy_pass http://evergarden_approval_ui; }
    location = /assets/oauth.js { proxy_pass http://evergarden_approval_ui; }

    # Locally generated proxy failures must remain JSON on the browser API.
    # Leave upstream JSON errors intact (proxy_intercept_errors stays off).
    # The read timeout exceeds mail-ui's 150 s internal MCP execute timeout.
    location ^~ /api/ {
        error_page 502 503 504 = @evergarden_api_unavailable;
        error_page 413 = @evergarden_api_too_large;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://evergarden_mail_ui;
    }

    location @evergarden_api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"The service is temporarily unavailable. Refresh later and check the result of any action you already submitted.","reason_code":"UPSTREAM_UNAVAILABLE"}';
    }

    location @evergarden_api_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"detail":"The request is too large. Reduce its size and try again.","reason_code":"REQUEST_TOO_LARGE"}';
    }

    location ^~ /bridge/ {
        client_max_body_size 24m;
        error_page 502 503 504 = @evergarden_api_unavailable;
        error_page 413 = @evergarden_api_too_large;
        proxy_pass http://evergarden_mail_ui;
    }

    location / {
        proxy_pass http://evergarden_mail_ui;
    }
}
