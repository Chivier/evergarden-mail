# EVERGARDEN_GATEWAY_REAL_IP=proxy: a reverse proxy sits in front.
#
# nginx's realip module walks X-Forwarded-For from the right and takes the first
# address that is not a trusted proxy; requests from any other peer keep the
# peer as the client, so their X-Forwarded-For is ignored. The trusted proxies
# come from EVERGARDEN_GATEWAY_TRUSTED_PROXIES (default: loopback, RFC 1918 and
# fc00::/7, the ranges a proxy on a Docker network connects from), written to
# the file below by entrypoint.sh at start.
#
# Anyone who can reach the gateway port from a trusted range can claim any
# client address, so in this mode only the proxy may reach it: never publish
# the gateway port on 0.0.0.0 or a LAN address while any proxy is trusted.
include /tmp/evergarden-gateway/trusted-proxies.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# After realip, $remote_addr is the resolved client.
map $remote_addr $evergarden_client_ip {
    default $remote_addr;
}
