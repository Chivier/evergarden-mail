# EVERGARDEN_GATEWAY_REAL_IP=direct (the default).
#
# The client is the TCP peer of the gateway. Every forwarding header
# (X-Forwarded-For, CF-Connecting-IP, ...) is ignored, so nothing a client sends
# can change the address the mail UI's login throttle keys on.
#
# Right when nothing sits in front of the gateway (localhost-only installs).
# Behind a reverse proxy every remote client would appear as the proxy and
# share one throttle bucket: use proxy or cloudflare there.
map $remote_addr $evergarden_client_ip {
    default $remote_addr;
}
