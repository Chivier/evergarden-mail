# EVERGARDEN_GATEWAY_REAL_IP=cloudflare: Cloudflare in front, directly or
# through a reverse proxy.
#
# First the same realip step as proxy mode resolves the hop that reached the
# trusted proxies (or the TCP peer when nothing trusted is in front). When that
# hop is a Cloudflare edge address (cloudflare-ranges.conf, regenerated by
# deploy/scripts/update_cloudflare_ranges.py), the client is the address in
# CF-Connecting-IP, which Cloudflare sets itself. From any other hop the header
# is ignored, so a client that bypasses Cloudflare cannot forge it.
#
# Same exposure rule as proxy mode: only the proxy (or Cloudflare) may reach
# the gateway port from a trusted range.
include /tmp/evergarden-gateway/trusted-proxies.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $evergarden_via_cloudflare {
    default 0;
    include /etc/nginx/real-ip/cloudflare-ranges.conf;
}

# CF-Connecting-IP must be exactly one IPv4 or IPv6 address. geo parses it with
# nginx's own address parser; a value that does not parse (junk, a list, an
# empty header) is looked up as 255.255.255.255, which falls in the reserved
# 240.0.0.0/4 block (never a real client) and therefore maps to 0.
geo $http_cf_connecting_ip $evergarden_cf_client_valid {
    default 1;
    240.0.0.0/4 0;
}

map "$evergarden_via_cloudflare:$evergarden_cf_client_valid:$http_cf_connecting_ip" $evergarden_client_ip {
    "~^1:1:(?<evergarden_cf_client>[0-9A-Fa-f.:]+)$" $evergarden_cf_client;
    default $remote_addr;
}
