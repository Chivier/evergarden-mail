# Evergarden single-host stack. Compose-level settings (project name, images,
# host ports, UID/GID, profiles) come from .env; see .env.example. Application
# settings live in .local/run/runtime.env; see runtime.env.example. Both are
# generated by ./deploy/setup.
#
# Every resource name derives from EVERGARDEN_COMPOSE_PROJECT. It names the
# Postgres volume that holds the database, so pick it once and keep it.
name: ${EVERGARDEN_COMPOSE_PROJECT:-evergarden}

x-runtime: &runtime
  build:
    context: .
  image: ${EVERGARDEN_IMAGE:-evergarden:local}
  # Required: without it Compose would start the stack unconfigured and Docker
  # would create root-owned directories in place of the missing secret files.
  # Run ./deploy/setup first.
  env_file:
    - path: ./.local/run/runtime.env
      required: true
  environment:
    PGPASSFILE: /run/secrets/pgpass
  user: "${EVERGARDEN_UID:-1000}:${EVERGARDEN_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Services that use the database list their networks explicitly and add db.
  networks:
    - internal
    - egress

services:
  postgres:
    image: postgres:17.6-bookworm
    group_add:
      - "${EVERGARDEN_GID:-1000}"
    environment:
      POSTGRES_DB: evergarden
      POSTGRES_USER: evergarden
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.local/run/postgres_password:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evergarden -d evergarden"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Only on the db network: services without database credentials (mail-ui,
    # gateway, oauth-maintenance, mfa-autologin) cannot open a connection to it.
    networks:
      - db

  # One-shot schema migration and writer-control reconciliation. It runs on
  # every `up` before the services that use the database; it is idempotent and
  # is the same command as `docker compose run --rm worker python -m
  # apps.worker.main migrate`.
  migrate:
    <<: *runtime
    command: ["python", "-m", "apps.worker.main", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.local/run/pgpass:/run/secrets/pgpass:ro
      - ./.local/run/mail-config:/run/mail-config:ro
    restart: "no"
    networks:
      - db

  mcp:
    <<: *runtime
    command: ["python", "-m", "apps.mcp.main"]
    # Approved executions take up to ~30 s; the dispatcher stops between items.
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./.local/data/archive:/data/archive:rw
      - ./.local/data/secrets:/data/secrets:rw
      - ./.local/run/compatibility_tokens.json:/run/secrets/compatibility_tokens.json:ro
      # Self-service API keys. Written only by mail-ui; MCP re-reads it on change.
      - ./.local/run/mcp-api-keys:/run/mcp-api-keys:ro
      - ./.local/run/credential_store_key:/run/secrets/credential_store_key:ro
      - ./.local/run/mail-config:/run/mail-config:ro
      - ./.local/run/pgpass:/run/secrets/pgpass:ro
    networks:
      - internal
      - egress
      - db
    ports:
      - "${EVERGARDEN_MCP_BIND:-127.0.0.1}:${EVERGARDEN_MCP_PORT:-8420}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  approval-ui:
    <<: *runtime
    command: ["python", "-m", "apps.approval_ui.main"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Read by ArchiveReader (SQLite mode=ro) to show the full mail under review;
      # rw only because WAL readers must update the -shm index.
      - ./.local/data/archive:/data/archive:rw
      - ./.local/data/secrets:/data/secrets:rw
      - ./.local/run/credential_store_key:/run/secrets/credential_store_key:ro
      - ./.local/run/mail-config:/run/mail-config:ro
      - ./.local/run/pgpass:/run/secrets/pgpass:ro
      - ./.local/run/admin_session_key:/run/secrets/admin_session_key:ro
    networks:
      - internal
      - egress
      - db
    ports:
      - "${EVERGARDEN_APPROVAL_BIND:-127.0.0.1}:${EVERGARDEN_APPROVAL_PORT:-8421}:8010"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mail-ui:
    <<: *runtime
    command: ["python", "-m", "apps.mail_ui.main"]
    depends_on:
      mcp:
        condition: service_healthy
    volumes:
      - ./.local/data/archive:/data/archive:rw
      - ./.local/run/credential_store_key:/run/secrets/credential_store_key:ro
      - ./.local/run/mail_ui_mcp_token:/run/secrets/mail_ui_mcp_token:ro
      - ./.local/run/admin_credentials.json:/run/secrets/admin_credentials.json:ro
      - ./.local/run/admin_session_key:/run/secrets/admin_session_key:ro
      - ./.local/run/mail-config:/run/mail-config:rw
      - ./.local/run/mcp-api-keys:/run/mcp-api-keys:rw
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - internal

  worker:
    <<: *runtime
    command: ["python", "-m", "apps.worker.main", "due"]
    profiles: [jobs]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.local/data/archive:/data/archive:rw
      - ./.local/data/recovery:/data/recovery:ro
      - ./.local/data/reports:/data/reports:rw
      - ./.local/data/secrets:/data/secrets:rw
      - ./.local/run/credential_store_key:/run/secrets/credential_store_key:ro
      - ./.local/run/mail-config:/run/mail-config:ro
      - ./.local/run/pgpass:/run/secrets/pgpass:ro
    networks:
      - internal
      - egress
      - db

  # Opt-in in-stack scheduler (COMPOSE_PROFILES=scheduler): runs the worker's
  # `due` command at the start of every minute, which executes the jobs that
  # config/jobs.yaml schedules for that minute. Use it or a host timer such as
  # deploy/systemd/evergarden-production-dispatch.timer, not both (job leases make a
  # double run harmless, but it wastes a sync).
  scheduler:
    <<: *runtime
    command: ["python", "-m", "deploy.scripts.scheduler"]
    profiles: [scheduler]
    # On stop a running `due` job gets 100 s to finish before SIGTERM, then 10 s more.
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./.local/data/archive:/data/archive:rw
      - ./.local/data/recovery:/data/recovery:ro
      - ./.local/data/reports:/data/reports:rw
      - ./.local/data/secrets:/data/secrets:rw
      - ./.local/run/credential_store_key:/run/secrets/credential_store_key:ro
      - ./.local/run/mail-config:/run/mail-config:ro
      - ./.local/run/pgpass:/run/secrets/pgpass:ro
    networks:
      - internal
      - egress
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/scheduler-heartbeat').stat().st_mtime < 300"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  oauth-maintenance:
    <<: *runtime
    command: ["python", "-m", "apps.worker.oauth_maintenance"]
    profiles: [oauth-maintenance]
    volumes:
      - ./.local/data/archive:/data/archive:rw
      - ./.local/data/secrets:/data/secrets:rw
      - ./.local/run/credential_store_key:/run/secrets/credential_store_key:ro
      - ./.local/run/mail-config:/run/mail-config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/oauth-maintenance-heartbeat').stat().st_mtime < 600"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Unattended Microsoft reauthorization with a stored password and TOTP seed.
  # Only started when explicitly requested; see docs/advanced/mfa-autologin.md.
  # Optional, off by default: start only with COMPOSE_PROFILES=mfa-autologin and
  # EVERGARDEN_MFA_AUTOLOGIN_ENABLED=true, EVERGARDEN_MICROSOFT_OAUTH_FLOW=device_code
  # and EVERGARDEN_MICROSOFT_OAUTH_APP_NAME in runtime.env. A federated tenant also
  # lists its identity-provider hosts in EVERGARDEN_MFA_EXTRA_ALLOWED_HOSTS.
  mfa-autologin:
    <<: *runtime
    build:
      context: .
      dockerfile: deploy/autologin/Dockerfile
      args:
        BASE_IMAGE: ${EVERGARDEN_IMAGE:-evergarden:local}
    image: ${EVERGARDEN_AUTOLOGIN_IMAGE:-evergarden-autologin:local}
    command: ["python", "-m", "apps.mfa_autologin.main", "run"]
    profiles: [mfa-autologin]
    environment:
      PGPASSFILE: /run/secrets/pgpass
      HOME: /tmp
    shm_size: 256m
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    volumes:
      - ./.local/data/secrets:/data/secrets:rw
      - ./.local/data/reports:/data/reports:rw
      - ./.local/run/credential_store_key:/run/secrets/credential_store_key:ro
      - ./.local/run/mail-config:/run/mail-config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/mfa-autologin-heartbeat').stat().st_mtime < 1200"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - egress

  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      mcp:
        condition: service_healthy
      approval-ui:
        condition: service_healthy
      mail-ui:
        condition: service_healthy
    # The entrypoint renders the real-client-address mode into /tmp (a tmpfs)
    # and then runs the image's own entrypoint; see deploy/nginx/real-ip/.
    entrypoint: ["/bin/sh", "/etc/nginx/real-ip/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    # direct (default), proxy or cloudflare. A mode without a matching
    # deploy/nginx/real-ip/<mode>.env fails here, when Compose renders the file.
    env_file:
      - ./deploy/nginx/real-ip/${EVERGARDEN_GATEWAY_REAL_IP:-direct}.env
    environment:
      EVERGARDEN_GATEWAY_TRUSTED_PROXIES: ${EVERGARDEN_GATEWAY_TRUSTED_PROXIES:-}
    volumes:
      - ./deploy/nginx/evergarden-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/real-ip:/etc/nginx/real-ip:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # The browser entry point: mail UI, approvals and /mcp on one origin.
    # Loopback by default; put a TLS reverse proxy in front for remote use
    # (deploy/reverse-proxy/) or join an existing proxy network with
    # compose.proxy.yaml. In proxy and cloudflare modes with a trusted-proxy
    # list (the default, or anything but none) never bind this port to 0.0.0.0
    # or a LAN address: a client reaching it from a trusted range could claim
    # any address.
    ports:
      - "${EVERGARDEN_HTTP_BIND:-127.0.0.1}:${EVERGARDEN_HTTP_PORT:-8788}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/gateway-healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # internal reaches the apps; egress is the non-internal network Docker
    # needs to publish the port above.
    networks:
      - internal
      - egress

# internal: browser-facing apps and the gateway (no internet).
# egress:   non-internal; provider access and the published gateway port.
# db:       postgres and only the services that hold database credentials.
networks:
  internal:
    name: ${EVERGARDEN_COMPOSE_PROJECT:-evergarden}-internal
    internal: true
  db:
    name: ${EVERGARDEN_COMPOSE_PROJECT:-evergarden}-db
    internal: true
  egress:
    name: ${EVERGARDEN_COMPOSE_PROJECT:-evergarden}-egress

volumes:
  postgres-data:
    name: ${EVERGARDEN_COMPOSE_PROJECT:-evergarden}-postgres
